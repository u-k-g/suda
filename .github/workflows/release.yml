name: Release

on:
  push:
    tags:
      - "v[0-9]*.[0-9]*.[0-9]*"
      - "[0-9]*.[0-9]*.[0-9]*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the tagged revision
        uses: actions/checkout@v7

      - name: Read version from tag
        id: version
        shell: bash
        run: |
          set -euo pipefail

          tag="${GITHUB_REF_NAME#v}"
          release_type=""
          release_version=""
          if [[ "$tag" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            release_type="stable"
            release_version="$tag"
          elif [[ "$GITHUB_REF_NAME" =~ ^v((0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*))-dev\.([0-9]{8})\.([0-9]{4})$ ]]; then
            release_type="dev"
            release_version="${BASH_REMATCH[1]}"
            date_utc="${BASH_REMATCH[5]}"
            minute_of_day="${BASH_REMATCH[6]}"
            if normalized_date="$(date -j -u -f '%Y%m%d' "$date_utc" '+%Y%m%d' 2>/dev/null)"; then
              :
            else
              normalized_date="$(date -u -d "${date_utc:0:4}-${date_utc:4:2}-${date_utc:6:2}" '+%Y%m%d' 2>/dev/null || true)"
            fi
            if [[ "$normalized_date" != "$date_utc" ]] || (( 10#$minute_of_day > 1439 )); then
              echo "Invalid UTC timestamp in development release tag: $GITHUB_REF_NAME" >&2
              exit 1
            fi
          else
            echo "Expected vX.Y.Z or vX.Y.Z-dev.YYYYMMDD.mmmm; got $GITHUB_REF_NAME" >&2
            exit 1
          fi

          IFS=. read -r major minor patch <<< "$release_version"
          if (( major > 65535 || minor > 65535 || patch > 65535 )); then
            echo "Chrome manifest version components must not exceed 65535: $release_version" >&2
            exit 1
          fi
          {
            echo "number=$release_version"
            echo "release_type=$release_type"
            echo "release_version=$tag"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
          cache: true

      - name: Build unpacked extension
        env:
          SUDA_VERSION: ${{ steps.version.outputs.number }}
        run: ./build_scripts/build.ts

      - name: Verify packaged manifest version
        env:
          SUDA_VERSION: ${{ steps.version.outputs.number }}
        run: |
          built_version="$(deno eval "console.log(JSON.parse(Deno.readTextFileSync('dist/suda/manifest.json')).version)")"
          test "$built_version" = "$SUDA_VERSION"

      - name: Package release
        working-directory: dist
        run: |
          zip -qr suda.zip suda
          unzip -t suda.zip

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          SUDA_RELEASE_TYPE: ${{ steps.version.outputs.release_type }}
          SUDA_RELEASE_VERSION: ${{ steps.version.outputs.release_version }}
        run: |
          set -euo pipefail

          release_args=(
            "$GITHUB_REF_NAME"
            dist/suda.zip
            --verify-tag
            --generate-notes
            --title "Suda $SUDA_RELEASE_VERSION"
          )
          if [[ "$SUDA_RELEASE_TYPE" == "dev" ]]; then
            release_args+=(--prerelease --latest=false)
          else
            release_args+=(--latest)
          fi
          gh release create "${release_args[@]}"
